name: build-image

# Builds the Grand Challenge submission image, runs it over a real cohort, and
# publishes the `docker save` tarball as an artifact to upload to the platform.
#
# This workflow is not a convenience -- it is the only path to a submission. The
# build host has no container runtime (no Docker; rootless podman is unavailable
# because /etc/subuid has no entry for the build user), so the image cannot be
# built or executed anywhere else. The smoke-test job therefore carries the
# weight that a local `docker run` would normally carry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (default: the commit SHA)"
        required: false
        default: ""

env:
  IMAGE_TAG: chimera-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (for the cohort builder and the output checker)
        run: pip install -e '.[dev]'

      - name: Clone reference repos
        run: |
          git clone --depth 1 https://github.com/DIAGNijmegen/chimera-agent-baseline refs/baseline
          git clone --depth 1 https://github.com/DIAGNijmegen/CHIMERA-agent          refs/challenge

      - name: Build the fixture cohort
        run: python -m chimera.cli.make_fixtures

      - name: Build the image
        run: docker build --platform=linux/amd64 --tag "${IMAGE_TAG}" .

      - name: Report image size
        run: |
          docker image inspect "${IMAGE_TAG}" --format '{{.Size}}' \
            | awk '{printf "image size: %.1f MB\n", $1/1024/1024}'

      # The real test: one container per case, offline, non-root, GC's mounts.
      - name: Smoke-test the image
        run: scripts/smoke_test_image.sh "${IMAGE_TAG}" work/fixtures work/smoke

      # The prior ships as package data; if packaging ever drops it the
      # predictor would silently fall back to defaults rather than fail.
      - name: Assert the fitted prior is inside the image
        run: |
          docker run --rm --network none --entrypoint python3 "${IMAGE_TAG}" -c "
          from chimera.predictors.prior import load_params
          p = load_params()
          assert p['task1']['reveal_sequence'] == ['radiology_report'], p['task1']
          assert p['task2']['reveal_sequence'] == [], p['task2']
          print('prior loaded from the image:', sorted(k for k in p if k.startswith('task')))
          "

      - name: Save the image
        run: |
          name="${{ github.event.inputs.tag }}"
          [ -n "${name}" ] || name="${GITHUB_SHA::12}"
          echo "ARTIFACT_NAME=${IMAGE_TAG}-${name}" >> "${GITHUB_ENV}"
          docker save "${IMAGE_TAG}" | gzip -c > "${IMAGE_TAG}-${name}.tar.gz"
          ls -lh "${IMAGE_TAG}-${name}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          retention-days: 30
          compression-level: 0 # already gzipped
