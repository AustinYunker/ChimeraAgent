[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "0.1.0"
description = "CHIMERA-agent challenge entry (MICCAI 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

# The fitted prior ships inside the submission container, so it must land in the
# wheel rather than only existing in the source checkout.
[tool.setuptools.package-data]
"chimera.predictors" = ["prior_params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
