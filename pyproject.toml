[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "0.1.0"
description = "CHIMERA-agent challenge entry (MICCAI 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "pydantic>=2",
]

[project.optional-dependencies]
# The suite imports and subprocesses the official evaluation/evaluate.py, so it
# needs that script's own runtime dependencies too. `requests` is imported at
# its module top level and is therefore required even with the rationale judge
# disabled; `deepeval` and `ollama` are imported lazily inside the judge path
# and are deliberately not installed, since we always score with
# USE_RATIONALE_JUDGE=0. None of this reaches the submission image, which
# installs with --no-deps.
#
# `mcp` is the official SDK. It is a *test* dependency only: our client and
# server are hand-rolled stdlib precisely because the SDK's own dependency tree
# (pydantic, anyio, httpx, starlette, uvicorn) cannot go in the image. It is
# here so tests/test_mcp_conformance.py can drive our server with the reference
# client, which is the only evidence that "we speak MCP" is a protocol claim
# rather than a naming convention.
dev = ["pytest", "requests>=2.31.0", "mcp>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

# The fitted prior ships inside the submission container, so it must land in the
# wheel rather than only existing in the source checkout.
[tool.setuptools.package-data]
"chimera.predictors" = ["prior_params.json", "guideline_params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Needs data/train_release, which is not redistributable and therefore never
    # present in CI. CHIMERA_REQUIRE_REFS exempts these from its no-skip rule --
    # see tests/conftest.py. Everything else must run there.
    "requires_release_data: needs the released challenge data on disk",
]
